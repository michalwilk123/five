[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "five-cli"
version = "0.1.0"
description = "CLI wrapper and proxy manager for Claude with mitmproxy"
requires-python = ">=3.12"
dependencies = [
  "click>=8.2.1",
  "mitmproxy>=12.1.2",
]

[project.scripts]
five = "five_cli.cli.app:cli"

[tool.uv]
dev-dependencies = [
  "pytest>=8.4.2",
  "ruff>=0.5.0",
]

[tool.ruff]
src = ["five_cli"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["five_cli"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.uv.build-backend]
module-name = "five_cli"
module-root = ""

