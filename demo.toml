class DepartmentViewSet(viewsets.ModelViewSet, FacilityFilteredGenericViewSet):
    queryset = Department.active_objects.all()
    serializer_class = DepartmentSerializer
    pagination_class = DetailedPagination
    permission_classes = [permissions.IsAuthenticated, DepartmentViewSetPermission]

    def destroy(self, request, *args, **kwargs):
        # TODO te wszystkie checki przeniesione do jakiejś metody z modelu Department i do niej się tu odwoływać?
        errors = u""
        department = get_object_or_404(self.get_queryset(), pk=kwargs['pk'])
        self.check_object_permissions(self.request, department)
        offices = Office.objects.filter(department=department, active=True)

        if offices.exists():
            errors += u"Istnieją gabinety: "
            for office in offices:
                errors += office.name + u", "
            errors += u"które są związane z tym oddziałem!"

        if len(errors):
            return bad_request(errors)

        delete_department(department)

        return Response(status=status.HTTP_204_NO_CONTENT)
