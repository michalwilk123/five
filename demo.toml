class EmailDeviceSerializer(DeviceMixin,
                            serializers.ModelSerializer):
    email = serializers.CharField(source='get_email', read_only=True)
    locked_until = serializers.DateTimeField(read_only=True, allow_null=True)
    url_detail = serializers.URLField(read_only=True)
    persistent_id = serializers.CharField(read_only=True)

    class Meta:
        model = EmailDevice
        read_only_fields = [
            'id', 'persistent_id', 'name', 'email', 'code', 'url_detail', 'is_valid', 'locked_until',
            'captcha_required', 'valid_until']
        fields = read_only_fields + ['confirmed']

    def to_representation(self, instance):
        ret = super(EmailDeviceSerializer, self).to_representation(instance)
        if self.anonymize:
            ret['email'] = re.sub(r'(?<=.).(?=..*@)', '*', ret['email'])
        return ret
""", """
class OfficeSerializer(serializers.ModelSerializer):
    department = FacilityFilteredRelatedField(queryset=Department.objects)
    zl_doctors = serializers.SerializerMethodField()

    class Meta:
        model = Office
        fields = ('id', 'name', 'active', 'department', 'zl_doctors')

    def get_zl_doctors(self, obj):
        return [om.doctor_id for om in obj.officemapping_set.all()]
