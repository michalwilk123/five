class PersonChildViewIsAboutMe(BasePermission):
    \"""
        Allows access only to users that requested their own data.
    \"""

    def has_permission(self, request, view):
        return isinstance(view, NestedViewsetMixIn) and \
               hasattr(request, 'user') and hasattr(request.user, 'person') and \
               self._requested_person_is_requester(view.get_nested_parent_object(), request.user.person)

    def _requested_person_is_requester(self, requested_person, requester_person):
        return requested_person.id == requester_person.id
""",
