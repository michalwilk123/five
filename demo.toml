    @swagger_auto_schema(
        operation_id='Wyszukiwanie procedur z listy ICD-9',
        tags=['Klasyfikacje'],
        operation_description='Wyszukiwanie procedur z listy ICD-9',
        manual_parameters=[search_query_parameter],
        responses={"200": DictionariesPagination.get_paginated_serializer(ICD9Serializer(many=True))}
    )
    @action(detail=False, methods=['get'])
    def icd9(self, request):
        \"""
        Wyszukuje procedury medyczne z klasyfikacji ICD-9 zarówno po nazwie, opisie jak i samym kodzie ICD-9
        \"""
        TAG = "icd9 (nazwa z opisem)"
        if not request.GET.get("search_query"):
            raise ValidationError({"search_query", "Field search_query required"})
        query = request.GET.get("search_query")
        data = get_possible_model_tag_objects(request.user, TAG, query, offset=None, limit=None)
        return self.paginator.get_paginated_response(data, ICD9Serializer, request)
"""]

