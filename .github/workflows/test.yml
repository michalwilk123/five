name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: latest
    
    - name: Install dependencies
      run: uv sync
    
    - name: Download test repositories
      run: |
        mkdir test_repositories
        cd test_repositories
        git clone --depth=1 https://github.com/asottile/babi.git &
        git clone --depth=1 https://github.com/msiemens/tinydb.git &
        git clone --depth=1 https://github.com/pallets/flask.git &
        git clone --depth=1 https://github.com/pre-commit/pre-commit.git &
        wait
        cd ..
    
    - name: Run tests
      run: uv run inv test 