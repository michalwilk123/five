name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - name: install
        run: uv sync --frozen
      - name: configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - name: test
        run: uv run pytest

